nav{position:fixed;top:0;right:0;z-index:50;display:flex;gap:clamp(8px,1.5vw,20px);padding:clamp(12px,1.6vw,24px)}

<section class="page" id="photos"><div class="pile" id="pile"></div></section>
<section class="page" id="about"><div class="about"><p>Same name. Different places.</p><p>No message, no meaning to explain.</p><p><span class="hlt">Just a name</span> making its way through the streets.</p><div class="sign"><a class="signoff hlt" href="#">RICSOU</a></div></div></section>

<script>
// Logo : une image par lettre, le survol est detecte sur la forme exacte de la lettre
var names=['r','idot','i','c','s','o','u'],stage=document.getElementById('stage'),CW=768,CH=512;
var L=[],Lp=null,PH=false,cur=null,SR=stage.getBoundingClientRect();
function build(suffix,cls){
  var arr=[];
  names.forEach(function(n){
    var im=new Image();im.decoding='async';im.alt=(n==='r'&&!suffix)?'RICSOU':'';im.className=cls;im.src='l_'+n+suffix+'.png?v=13';stage.appendChild(im);
    var o={img:im,data:null,name:n,yel:false};arr.push(o);
    im.onload=function(){
      if(o.data)return;o.orig=im.src;o.base=new Image();o.base.src=im.src;
      var c=document.createElement('canvas');c.width=CW;c.height=CH;
      var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,CW,CH);
      o.data=x.getImageData(0,0,CW,CH).data;
      var sx=0,sy=0,k=0,x0=CW,y0=CH,x1=0,y1=0;
      for(var j=0;j<CH;j++)for(var i2=0;i2<CW;i2++)if(o.data[(j*CW+i2)*4+3]>40){
        if(i2<x0)x0=i2;if(i2>x1)x1=i2;if(j<y0)y0=j;if(j>y1)y1=j;
        if(!(i2%4)&&!(j%4)){sx+=i2;sy+=j;k++}}
      if(k)im.style.transformOrigin=(sx/k/CW*100)+'% '+(sy/k/CH*100)+'%';
      o.bb=[x0,y0,x1+1,y1+1];layout();
    };
  });
  return arr;
}
L=build('','d');
function act(){return PH&&Lp?Lp:L}
function hit(e){
  var r=SR,found=null,A=act();
  for(var i=0;i<A.length&&!found;i++){var o=A[i],d=o.data;if(!d)continue;
    var g=o.geo,px,py;
    if(g){px=Math.floor((e.clientX-r.left-g.ox)/g.w*CW);py=Math.floor((e.clientY-r.top-g.oy)/g.h*CH)}
    else{px=Math.floor((e.clientX-r.left)/r.width*CW);py=Math.floor((e.clientY-r.top)/r.height*CH)}
    if(px>=0&&py>=0&&px<CW&&py<CH&&d[(py*CW+px)*4+3]>40)found=o}
  if(found!==cur){if(cur)cur.img.classList.remove('on');if(found)found.img.classList.add('on');cur=found}
}
// Telephone (portrait) : logo recompose en lignes de grosses lettres qui remplissent tout l'ecran
var GROUPS=[['r'],['i','idot'],['c'],['s'],['o'],['u']];
function layout(){
  SR=stage.getBoundingClientRect();
  var ph=false; // telephone : le logo d'origine est simplement etire sur toute la page
  if(ph&&!Lp)Lp=build('_m','p');
  if(ph!==PH){PH=ph;stage.classList.toggle('ph',ph);if(cur){cur.img.classList.remove('on');cur=null}}
  if(!PH||!Lp||!Lp.every(function(o){return o.bb}))return;
  var W=SR.width,H=SR.height,G=GROUPS.map(function(n0){
    var m=n0.map(function(n){return Lp[names.indexOf(n)]}),b=[CW,CH,0,0];
    m.forEach(function(o){b[0]=Math.min(b[0],o.bb[0]);b[1]=Math.min(b[1],o.bb[1]);b[2]=Math.max(b[2],o.bb[2]);b[3]=Math.max(b[3],o.bb[3])});
    return{m:m,x0:b[0],y0:b[1],w:b[2]-b[0],h:b[3]-b[1]}});
  var best=null;
  for(var mask=0;mask<32;mask++){
    var rows=[[]];G.forEach(function(g,i){rows[rows.length-1].push(g);if(i<5&&(mask>>i&1))rows.push([])});
    var tot=0;rows.forEach(function(r){var sw=0,mh=0;r.forEach(function(g){sw+=g.w;mh=Math.max(mh,g.h)});r.s=W/sw;r.hh=mh*r.s;tot+=r.hh});
    var sy=H/tot,cost=Math.abs(Math.log(sy));
    rows.forEach(function(r){cost+=Math.abs(r.hh*sy/H-1/rows.length)*2});
    if(!best||cost<best.cost)best={rows:rows,sy:sy,cost:cost}}
  var y=0;
  best.rows.forEach(function(r){var x=0,rh=r.hh*best.sy;
    r.forEach(function(g){var tw=g.w*r.s,th=g.h*r.s*best.sy,tx=x,ty=y+(rh-th)/2;
      g.m.forEach(function(o){var iw=tw/(g.w/CW),ih=th/(g.h/CH),st=o.img.style,ox=tx-g.x0/CW*iw,oy=ty-g.y0/CH*ih;
        st.right=st.bottom='auto';st.left=ox+'px';st.top=oy+'px';st.width=iw+'px';st.height=ih+'px';
        o.geo={ox:ox,oy:oy,w:iw,h:ih}});
      x+=tw});
    y+=rh});
  stage.classList.add('rdy');
}
addEventListener('resize',layout);
var lastE=null,tick=false;
addEventListener('pointermove',function(e){lastE=e;if(!tick){tick=true;requestAnimationFrame(function(){tick=false;hit(lastE)})}});
addEventListener('pointerdown',hit);
document.addEventListener('pointerleave',function(){if(cur){cur.img.classList.remove('on');cur=null}});

// Photos : lues automatiquement dans le dossier "photos" du dépôt GitHub
var pile=document.getElementById('pile'),loaded=false,z=1;
function render(urls){
  pile.innerHTML='';
  var w=Math.min(pile.clientWidth||600,1100),cols=w>700?3:2,cw=Math.min(w*.46,300),step=cw*1.35;
  urls.forEach(function(u,i){
    var f=document.createElement('figure'),im=new Image();im.src=u;im.loading='lazy';f.appendChild(im);
    f.style.left=((i%cols)*(w-cw)/(cols-1))+'px';
    f.style.top=(Math.floor(i/cols)*step)+'px';
    f.style.setProperty('--x',(Math.random()*30-15)+'px');
    f.style.setProperty('--y',(Math.random()*30-15)+'px');
    f.style.setProperty('--rot',(Math.random()*16-8)+'deg');
    f.onclick=function(){f.style.zIndex=++z};
    pile.appendChild(f);setTimeout(function(){f.classList.add('show')},120*i);
  });
  pile.style.height=(Math.ceil(urls.length/cols)*step+cw)+'px';
}
function loadPhotos(){
  if(loaded)return;loaded=true;
  var m=location.hostname.match(/^(.+)\.github\.io$/);
  if(!m){pile.innerHTML='<p>Les photos s\'afficheront ici une fois le site en ligne sur GitHub Pages.</p>';return}
  var repo=location.pathname.split('/')[1]||location.hostname;
  fetch('https://api.github.com/repos/'+m[1]+'/'+repo+'/contents/photos')
   .then(function(r){return r.json()})
   .then(function(a){render(a.filter(function(x){return /\.(jpe?g|png|webp|gif)$/i.test(x.name)}).map(function(x){return x.download_url}).reverse())})
   .catch(function(){pile.textContent='Erreur de chargement des photos.'});
}
function route(){
  var h=location.hash.slice(1);
  document.querySelectorAll('.page').forEach(function(p){p.classList.toggle('open',p.id===h)});
  document.body.classList.toggle('in',h==='photos'||h==='about');
  if(h==='photos')loadPhotos();
}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('nav a,.back');if(a){a.classList.add('hl');setTimeout(function(){a.classList.remove('hl')},600)}});

// Marqueur : toujours la souris, sur toutes les pages
var mk=document.getElementById('mk'),HX=9,HY=69;
var mkT;
function mkMove(e){mk.style.opacity=1;mk.style.transform='translate3d('+(e.clientX-HX)+'px,'+(e.clientY-HY)+'px,0)'}
