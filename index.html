<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RICSOU</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;overflow:hidden;cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2764%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cg%20transform%3D%27rotate%2845%2032%2032%29%27%3E%3Crect%20x%3D%2722%27%20y%3D%274%27%20width%3D%2720%27%20height%3D%2740%27%20rx%3D%274%27%20fill%3D%27%23111%27/%3E%3Crect%20x%3D%2722%27%20y%3D%2718%27%20width%3D%2720%27%20height%3D%275%27%20fill%3D%27%23fff%27/%3E%3Cpath%20d%3D%27M24%2044h16l-3%208H27z%27%20fill%3D%27%23777%27/%3E%3Crect%20x%3D%2727%27%20y%3D%2752%27%20width%3D%2710%27%20height%3D%279%27%20fill%3D%27%23999%27/%3E%3C/g%3E%3C/svg%3E") 11 54, crosshair}
a,figure{cursor:inherit}
nav{position:fixed;top:0;right:0;z-index:50;display:flex;gap:clamp(18px,3vw,44px);padding:clamp(16px,2.2vw,32px);mix-blend-mode:difference}
nav a,.back{color:#fff;text-decoration:none;font-size:clamp(20px,2.6vw,40px);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
nav a:hover,.back:hover{text-decoration:underline}
.back{position:fixed;top:0;left:0;z-index:60;padding:clamp(16px,2.2vw,32px);display:none;color:#000!important}
body.in .back{display:block}
body.in nav{display:none}
#stage{position:fixed;inset:0;overflow:visible}
@media (max-aspect-ratio:1/1){#stage{inset:auto;left:0;width:100vw;height:66.67vw;top:50%;transform:translateY(-50%)}}
#stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;transition:transform .35s cubic-bezier(.2,1,.3,1);user-select:none;-webkit-user-drag:none}
#stage img.on{transform:scale(1.14);z-index:5}
.page{position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;padding:clamp(90px,9vw,140px) 24px 40px;transform:translateY(100%);transition:transform .55s cubic-bezier(.7,0,.2,1);visibility:hidden}
.page.open{transform:none;visibility:visible}
.pile{position:relative;max-width:1100px;margin:0 auto}
.pile figure{position:absolute;width:min(46vw,300px);background:#fff;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(-60px);transition:transform .8s cubic-bezier(.2,1,.3,1),opacity .5s;cursor:pointer}
.pile figure.show{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--rot))}
.pile img{width:100%;display:block}
.about{max-width:560px;margin:10vh auto;font-size:clamp(22px,4vw,34px);line-height:1.25}
</style>
</head>
<body>
<nav><a href="#photos">Photos</a><a href="#about">About</a></nav>
<a class="back" href="#">← BACK</a>

<div id="stage"></div>

<section class="page" id="photos"><div class="pile" id="pile"></div></section>
<section class="page" id="about"><p class="about">RICSOU — tags &amp; photos de rue.<br><br>Contact : @ricsou</p></section>

<script>
// Logo : une image par lettre, le survol est détecté sur la forme exacte de la lettre
var names=['r','idot','i','c','s','o','u'],stage=document.getElementById('stage'),L=[],CW=768,CH=512,ready=0;
names.forEach(function(n){
  var im=new Image();im.alt=n==='r'?'RICSOU':'';im.src='l_'+n+'.png';stage.appendChild(im);
  var o={img:im,data:null};L.push(o);
  im.onload=function(){
    var c=document.createElement('canvas');c.width=CW;c.height=CH;
    var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,CW,CH);
    o.data=x.getImageData(0,0,CW,CH).data;
    // centre de la lettre = point de zoom
    var sx=0,sy=0,k=0;
    for(var j=0;j<CH;j+=4)for(var i2=0;i2<CW;i2+=4)if(o.data[(j*CW+i2)*4+3]>128){sx+=i2;sy+=j;k++}
    if(k)im.style.transformOrigin=(sx/k/CW*100)+'% '+(sy/k/CH*100)+'%';
  };
});
var cur=null;
function hit(e){
  var r=stage.getBoundingClientRect();
  var px=Math.floor((e.clientX-r.left)/r.width*CW),py=Math.floor((e.clientY-r.top)/r.height*CH),found=null;
  if(px>=0&&py>=0&&px<CW&&py<CH)
    for(var i=0;i<L.length;i++){var d=L[i].data;if(d&&d[(py*CW+px)*4+3]>40){found=L[i];break}}
  if(found!==cur){if(cur)cur.img.classList.remove('on');if(found)found.img.classList.add('on');cur=found}
}
addEventListener('pointermove',hit);
addEventListener('pointerdown',hit);
document.addEventListener('pointerleave',function(){if(cur){cur.img.classList.remove('on');cur=null}});

// Photos : lues automatiquement dans le dossier "photos" du dépôt GitHub
var pile=document.getElementById('pile'),loaded=false,z=1;
function render(urls){
  pile.innerHTML='';
  var w=Math.min(pile.clientWidth||600,1100),cols=w>700?3:2,cw=Math.min(w*.46,300),step=cw*1.35;
  urls.forEach(function(u,i){
    var f=document.createElement('figure'),im=new Image();im.src=u;im.loading='lazy';f.appendChild(im);
    f.style.left=((i%cols)*(w-cw)/(cols-1))+'px';
    f.style.top=(Math.floor(i/cols)*step)+'px';
    f.style.setProperty('--x',(Math.random()*30-15)+'px');
    f.style.setProperty('--y',(Math.random()*30-15)+'px');
    f.style.setProperty('--rot',(Math.random()*16-8)+'deg');
    f.onclick=function(){f.style.zIndex=++z};
    pile.appendChild(f);setTimeout(function(){f.classList.add('show')},120*i);
  });
  pile.style.height=(Math.ceil(urls.length/cols)*step+cw)+'px';
}
function loadPhotos(){
  if(loaded)return;loaded=true;
  var m=location.hostname.match(/^(.+)\.github\.io$/);
  if(!m){pile.innerHTML='<p>Les photos s\'afficheront ici une fois le site en ligne sur GitHub Pages.</p>';return}
  var repo=location.pathname.split('/')[1]||location.hostname;
  fetch('https://api.github.com/repos/'+m[1]+'/'+repo+'/contents/photos')
   .then(function(r){return r.json()})
   .then(function(a){render(a.filter(function(x){return /\.(jpe?g|png|webp|gif)$/i.test(x.name)}).map(function(x){return x.download_url}).reverse())})
   .catch(function(){pile.textContent='Erreur de chargement des photos.'});
}
function route(){
  var h=location.hash.slice(1);
  document.querySelectorAll('.page').forEach(function(p){p.classList.toggle('open',p.id===h)});
  document.body.classList.toggle('in',h==='photos'||h==='about');
  if(h==='photos')loadPhotos();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
