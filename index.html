<script>
// Logo : une image par lettre ; ordinateur = logo d'origine, téléphone = 3 rangées RI / CS / OU
var MQ=matchMedia('(max-aspect-ratio:1/1)'),L=[],cur=null;
var stage=document.getElementById('stage'),mstage=document.getElementById('mstage');
var MW=1200,MH=1737;
function addLayer(box,file,name,cw,ch){
  var im=new Image();im.decoding='async';im.alt=name==='r'?'RICSOU':'';im.src=file+'?v=20';box.appendChild(im);
  var o={img:im,box:box,name:name,yel:false,data:null,cw:cw,ch:ch,rect:null};L.push(o);
  im.onload=function(){
    if(o.data)return;o.orig=im.src;o.base=new Image();o.base.src=im.src;
    var c=document.createElement('canvas');c.width=cw;c.height=ch;
    var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,cw,ch);
    o.data=x.getImageData(0,0,cw,ch).data;
    var sx=0,sy=0,k=0;
    for(var j=0;j<ch;j+=4)for(var i2=0;i2<cw;i2+=4)if(o.data[(j*cw+i2)*4+3]>128){sx+=i2;sy+=j;k++}
    if(k)im.style.transformOrigin=(sx/k/cw*100)+'% '+(sy/k/ch*100)+'%';
    o.rect=box.getBoundingClientRect();
  };
}
function updRects(){L.forEach(function(o){o.rect=o.box.getBoundingClientRect()})}
function buildLogo(){
  L.forEach(function(o){o.img.remove()});L=[];cur=null;stage.innerHTML='';mstage.innerHTML='';
  if(MQ.matches){
    var row=document.createElement('div');row.className='mrow';row.style.aspectRatio=MW+'/'+MH;mstage.appendChild(row);
    ['r','idot','i','c','s','o','u'].forEach(function(n){addLayer(row,'m_'+n+'.png',n,MW/2,MH/2)});
  }else{
    ['r','idot','i','c','s','o','u'].forEach(function(n){addLayer(stage,'l_'+n+'.png',n,768,512)});
  }
  updRects();
}
addEventListener('resize',updRects);
if(MQ.addEventListener)MQ.addEventListener('change',buildLogo);
function hit(e){
  var found=null;
  for(var i=0;i<L.length;i++){var o=L[i],r=o.rect;if(!o.data||!r)continue;
    var px=Math.floor((e.clientX-r.left)/r.width*o.cw),py=Math.floor((e.clientY-r.top)/r.height*o.ch);
    if(px>=0&&py>=0&&px<o.cw&&py<o.ch&&o.data[(py*o.cw+px)*4+3]>40){found=o;break}}
  if(found!==cur){if(cur)cur.img.classList.remove('on');if(found)found.img.classList.add('on');cur=found}
}
var lastE=null,tick=false;
addEventListener('pointermove',function(e){lastE=e;if(!tick){tick=true;requestAnimationFrame(function(){tick=false;hit(lastE)})}});
addEventListener('pointerdown',hit);
// au toucher : la lettre « pop » puis revient à sa taille
addEventListener('pointerup',function(e){if(e.pointerType==='touch'&&cur){var c=cur;setTimeout(function(){c.img.classList.remove('on');if(cur===c)cur=null},350)}});
document.addEventListener('pointerleave',function(){if(cur){cur.img.classList.remove('on');cur=null}});
buildLogo();

// Photos : lues automatiquement dans le dossier "photos" du dépôt GitHub
var pile=document.getElementById('pile'),loaded=false,z=1;
function render(items){
  pile.innerHTML='';
  var w=Math.min(pile.clientWidth||600,1100),cols=w>700?3:2,cw=Math.min(w*.46,300),step=cw*1.35,colH=[],c;
  for(c=0;c<cols;c++)colH.push(0);
  items=items.map(function(it){return typeof it==='string'?{src:it}:it});
  items.sort(function(a,b){return (b.video?1:0)-(a.video?1:0)});   // les vidéos en haut
  items.forEach(function(it,i){
    var f=document.createElement('figure'),m,k,top;
    if(it.video){
      m=document.createElement('video');m.src=it.src;m.muted=true;m.loop=true;m.autoplay=true;m.playsInline=true;
      m.setAttribute('muted','');m.setAttribute('playsinline','');m.preload='auto';
      m.addEventListener('canplay',function(){var p=m.play();if(p&&p.catch)p.catch(function(){})});
      // vidéo : grande, centrée, sans cadre, sur toute la largeur
      var vw=Math.min(w,560);top=Math.max.apply(null,colH);
      f.className='vid';f.style.width=vw+'px';f.style.left=((w-vw)/2)+'px';f.style.top=top+'px';
      f.style.setProperty('--x','0px');f.style.setProperty('--y','0px');f.style.setProperty('--rot','0deg');
      for(c=0;c<cols;c++)colH[c]=top+vw*(it.ratio||1)+10;
    }else{
      m=new Image();m.src=it.src;m.loading='lazy';
      k=0;for(c=1;c<cols;c++)if(colH[c]<colH[k]-1)k=c;
      f.style.left=(cols>1?k*(w-cw)/(cols-1):0)+'px';
      f.style.top=colH[k]+'px';colH[k]+=step;
      f.style.setProperty('--x',(Math.random()*30-15)+'px');
      f.style.setProperty('--y',(Math.random()*30-15)+'px');
      f.style.setProperty('--rot',(Math.random()*16-8)+'deg');
    }
    f.appendChild(m);
    f.onclick=function(){f.style.zIndex=++z;if(m.play){var p=m.play();if(p&&p.catch)p.catch(function(){})}};
    pile.appendChild(f);setTimeout(function(){f.classList.add('show')},120*i);
  });
  pile.style.height=(Math.max.apply(null,colH)+cw*.3)+'px';
}
function loadPhotos(){
  if(loaded)return;loaded=true;
  var m=location.hostname.match(/^(.+)\.github\.io$/);
  if(!m){pile.innerHTML='<p>Les photos s\'afficheront ici une fois le site en ligne sur GitHub Pages.</p>';return}
  var repo=location.pathname.split('/')[1]||location.hostname;
  fetch('https://api.github.com/repos/'+m[1]+'/'+repo+'/contents/photos')
   .then(function(r){return r.json()})
   .then(function(a){render(a.filter(function(x){return /\.(jpe?g|png|webp|gif|mp4|webm|mov)$/i.test(x.name)}).map(function(x){return /\.(mp4|webm|mov)$/i.test(x.name)?{src:x.path,video:true}:{src:x.download_url}}).reverse())})
   .catch(function(){pile.textContent='Erreur de chargement des photos.'});

var hlT=[];
